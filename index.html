 const p=$('panel');let h='';

  else if(S.tab==='up')U.forEach((u,i)=>h+=row(u[1],u[2],u[3](S[u[0]]),'🪙 '+f(ucost(u)),`buyUp(${i})`,S.c<ucost(u)));

 if(loc==='rew'){h=`<h2>Награды</h2><p>Заходи каждый день и выполняй задания.</p>`;
  h+=row('🎁','Ежедневный подарок',canDaily()?'День '+dayNo()+' из 7 ждёт тебя':'приходи завтра · серия '+S.dr.s,canDaily()?'Забрать':'✓','openDaily()',!canDaily());

  h+=`<p style='margin:10px 0 6px'><b>Рекорды</b></p>`+row('📈','Всего заработано','🪙 '+f(S.st.earn),'','',0)+row('👆','Всего тапов',f(S.st.taps),'','',0)}
 if(loc==='bath'){h=`<h2>Ванна</h2><p>Чистота выше 50% даёт +25% к доходу. Она медленно падает. Тап по питомцу тоже чуть-чуть моет.</p><div class="bar"><i style="width:${Math.round(S.clean/5)*5}%"></i></div>`+row('🫧','Помыть питомца','+15% чистоты','Мыть','wash()',S.clean>=100);
  SO.forEach((s,i)=>{const l=Math.max(0,Math.ceil(((S.bo.soap||0)-now())/1000));h+=row(sp(s[1]),s[0],`доход ×${s[2]} на ${s[3]} с`+(l&&S.bo.sm===s[2]?` · ещё ${l} с`:''),'🪙 '+f(s[4]),`buySoap(${i})`,S.c<s[4])})}
 if(loc==='street'){const w=Math.max(0,Math.ceil((S.walk-now())/1000));h=`<h2>Улица</h2><p>Питомцы гуляют и находят монеты. Награда растёт вместе с доходом.</p>`+row('🦮','Прогулка',w?'вернутся через '+w+' с':'готовы идти','Гулять','go()',w>0)}
 if(loc==='kitchen'){h=`<h2>Кухня</h2><p>Покорми питомцев, и они поработают в усиленном режиме. Сытость выше 50% даёт полный доход.</p><div class="bar"><i style="width:${Math.round(S.food/5)*5}%"></i></div>`+row('🥣','Миска корма','+40 сытости','🪙 '+f(fc()),'feed()',S.c<fc()||S.food>=100);B.forEach((b,i)=>{const l=Math.max(0,Math.ceil(((S.bo[b[2]]||0)-now())/1000));h+=row(b[0],b[1],b[6]+(l?' · ещё '+l+' с':''),'🪙 '+f(b[5]),`boost(${i})`,S.c<b[5])})}
 if(loc==='rt'){const sc=score(),ri=rkI(sc),R=RK[ri],N=RK[ri+1];
  if(DB&&!RT.ok&&!RT.load&&!RT.err&&now()>=rtNext)setTimeout(refreshRt,0);
  h=`<h2>Рейтинг</h2>`+row(R[1],'Твой ранг: '+R[0],'Заработано всего: 🪙 '+f(sc),'','',0);
  h+=N?`<div class="bar"><i style="width:${Math.round((sc-R[2])/(N[2]-R[2])*20)*5}%"></i></div><p>До ранга «${N[0]}» осталось 🪙 ${f(N[2]-sc)}. Потраченные монеты ранг не снижают.</p>`:`<p>Высший ранг! Потраченные монеты ранг не снижают.</p>`;
  h+=`<div class="tabs t3">`+[['all','🌍 Все'],['fr','👥 Друзья'],['rk','🏅 Ранги']].map(t=>`<button class="${rtab===t[0]?'on':''}" onclick="rtab='${t[0]}';paint()">${t[1]}</button>`).join('')+`</div>`;
  if(rtab==='rk')RK.forEach((q,i)=>h+=row(q[1],q[0]+(i===ri?' · ты здесь':''),i?'от 🪙 '+f(q[2])+' заработанных':'с начала игры','','',0));
  else{const busy=RT.load||now()<rtNext;
   h+=`<button class="rf ${RT.load?'spin':''}" ${busy||!DB?'disabled':''} onclick="refreshRt()"><i>🔄</i> ${RT.load?'Обновляю…':busy?'Обновить через '+Math.max(1,Math.ceil((rtNext-now())/1000))+' с':'Обновить рейтинг'}</button>`;
   if(!DB)h+=`<p>Онлайн-рейтинг пока не подключён: другие игроки не видны.</p>`;
   if(RT.err)h+=`<p>${RT.err}</p>`;
   const me={id:UID,n:NAME,s:sc},src=DB?(rtab==='fr'?RT.fr:RT.all):[],a=src.filter(x=>x.id!==UID).concat([me]).sort((x,y)=>y.s-x.s);
   a.slice(0,50).forEach((x,i)=>h+=rr(i+1,x));if(a.indexOf(me)>=50)h+=rr(0,me);
   if(DB&&rtab==='fr'&&RT.ok&&a.length<2)h+=`<p>Пока нет друзей в рейтинге. Пригласи друга по ссылке во вкладке «Награды».</p>`}}
 if(p._h!==h&&!pdn){const sc=p.scrollTop;p.innerHTML=h;p._h=h;p.scrollTop=sc}
 $('stage').dataset.s=loc;{const T=tod(),k=loc+T+(loc==='room'?Object.keys(S.fur).join():'');if($('deco').dataset.l!==k){$('deco').dataset.l=k;let s=SC[loc];if(loc==='street'&&T==='n')s=s.replace('fill="#ffd93d"','fill="#f4f1de"');if(loc==='room'){if(T!=='d')s=s.replace('fill="#9fd8ff"',T==='n'?'fill="#16204a"':'fill="#f6a96b"');s=s.replace('</svg>',Object.keys(S.fur).map(i=>FU[i][2]).join('')+'</svg>')}$('deco').innerHTML=s;$('tod').innerHTML=T==='n'&&loc==='street'?A(14).map(i=>`<b style='left:${(i*53)%92+3}%;top:${(i*29)%35+3}%'></b>`).join(''):'';amb()}$('stage').dataset.t=loc==='street'||loc==='room'?T:'d'}
 const tp=topPet(),own=P.map((_,i)=>i).filter(i=>S.n[i]&&i!==tp),ky=tp+'|'+own+'|'+S.hat+'|'+md()+(S.clean<50);
 if($('pet').dataset.k!==ky){$('pet').dataset.k=ky;$('pet').classList.toggle('aura',tp>=5);$('psv').innerHTML=pv(tp);$('herd').innerHTML=own.slice(-3).map(i=>`<div class='hp' data-i='${i}' style='translate:${(S.pp[i]||[0,0]).map(v=>v+'px').join(' ')}'>${pv(i)}</div>`).join('')}
 if($('nav')._l!==loc){$('nav')._l=loc;$('nav').innerHTML=L.map(l=>`<button class="${l[0]===loc?'on':''}" onclick="loc='${l[0]}';paint()"><span>${l[1]}</span>${l[2]}</button>`).join('')}hud()}
function hud(){$('c').textContent=f(S.c);$('ips').textContent=f(ips());$('tpw').textContent=f(tpw());$('gift').classList.toggle('dot',canDaily());
 let c='<span class="chip">'+RK[rkI(S.st.earn)].slice(0,2).reverse().join(' ')+'</span>';const tx=[S.food<50?'🍽 голодный':'',S.clean<50?'🫧 грязнуля':''].filter(Boolean).join(' · ');if($('tb')._t!==tx){$('tb')._t=tx;$('tb').textContent=tx;$('tb').classList.toggle('show',!!tx)}if(false)c+='<span class="chip">🫧 грязнуля</span>';['inc','tap','both','soap'].forEach(k=>{if(on(k))c+=`<span class="chip">⚡ ${Math.ceil((S.bo[k]-now())/1000)} с</span>`});if($('chips')._h!==c){$('chips')._h=c;$('chips').innerHTML=c}}
let last=S.t;
function tick(){const t=now();let dt=(t-last)/1000;last=t;if(dt<=0)return;
 if(dt>3){const g=ips()*Math.min(dt,3600)*.5;gain(g);if(g>=1)toast('Пока тебя не было: 🪙 '+f(g));dt=Math.min(dt,300)}
 else{const g=(ips()+S.auto*tpw())*dt;gain(g)}
 S.clean=Math.max(0,S.clean-.1*dt);S.food=Math.max(0,S.food-.04*dt);chkRank();hud()}
setInterval(tick,100);
setInterval(paint,1000);
const RK=[['Бронза','🥉',0],['Серебро','🥈',5e3],['Золото','🥇',5e4],['Платина','💠',5e5],['Алмаз','💎',5e6],['Мастер','👑',5e7],['Легенда','🔥',5e8]];
const rkI=n=>{let r=0;RK.forEach((q,i)=>{if(n>=q[2])r=i});return r};
function chkRank(){const r=rkI(S.st.earn);if(S.rk<0)S.rk=r;else if(r>S.rk){S.rk=r;toast('Новый ранг: '+RK[r][1]+' '+RK[r][0]+'!');ding()}}
/* ===== ОНЛАЙН-РЕЙТИНГ: вставь сюда адрес Firebase Realtime Database, например 'https://xxxx-default-rtdb.firebaseio.com' ===== */
const DB='https://fluffyhome-705a7-default-rtdb.firebaseio.com';
const RF=10000,REFB=500,REFI=1000;
let RT={all:[],fr:[],ok:0,load:0,err:''},rtab='all',rtNext=0,lastScore=-1;
const score=()=>Math.floor(S.st.earn);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,qs,opt){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(DB.replace(/\/+$/,'')+'/'+path+'.json'+(qs?'?'+qs:''),Object.assign({signal:c.signal},opt||{}));if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(t)}}
function pushScore(force){if(!DB)return Promise.resolve();const n=score();if(!force&&n===lastScore)return Promise.resolve();lastScore=n;return api('players/'+UID,'',{method:'PUT',body:JSON.stringify({n:NAME,s:n,t:Date.now()}),keepalive:true}).catch(()=>{lastScore=-1})}
async function linkRef(){if(!DB||!S.ref||S.refOk)return;try{await api('friends/'+UID+'/'+S.ref,'',{method:'PUT',body:'"by"'});await api('friends/'+S.ref+'/'+UID,'',{method:'PUT',body:'"in"'});S.refOk=1}catch(e){}}
async function claimInv(){if(!DB)return;try{const d=await api('friends/'+UID,'')||{};let n=0;for(const k in d)if(d[k]==='in'&&!S.fr[k]){S.fr[k]=1;n++}if(n){gain(n*REFI);toast('Друг зашёл по твоей ссылке: +🪙 '+f(n*REFI));ding();paint()}}catch(e){}}
async function loadRating(){if(RT.load||!DB)return;RT.load=1;RT.err='';paint();
 try{await pushScore(true);await linkRef();await claimInv();
  const m=await api('players','orderBy=%22s%22&limitToLast=50')||{};
  RT.all=Object.keys(m).filter(k=>m[k]&&typeof m[k]==='object').map(k=>({id:k,n:String(m[k].n||'?'),s:+m[k].s||0}));
  const fd=await api('friends/'+UID,'')||{},ids=Object.keys(fd).slice(0,40);
  const ps=await Promise.all(ids.map(i=>api('players/'+i,'').then(q=>q&&typeof q==='object'?{id:i,n:String(q.n||'?'),s:+q.s||0}:null).catch(()=>null)));
  RT.fr=ps.filter(Boolean);RT.ok=1}
 catch(e){RT.err='Не удалось обновить рейтинг. Проверь интернет и попробуй ещё раз.'}
 RT.load=0;paint()}
function refreshRt(){const t=now();if(RT.load||t<rtNext||!DB)return;rtNext=t+RF;loadRating()}
function rr(p,x){const me=x.id===UID,q=RK[rkI(x.s)];return `<div class="row rr ${me?'me':''} ${p>0&&p<=3?'top':''}"><div class="e">${p?'#'+p:'…'}</div><div class="t"><b>${esc(x.n)}${me?' (ты)':''}</b><small>${q[1]} ${q[0]} · 🪙 ${f(x.s)}</small></div></div>`}

if(!SP){try{const q=new URLSearchParams(location.search);const hh=new URLSearchParams((location.hash||'').replace(/^#/,''));SP=q.get('startapp')||q.get('tgWebAppStartParam')||hh.get('tgWebAppStartParam')||(q.get('ref')?'ref'+q.get('ref'):'')}catch(e){}}
{const m=/^ref([\w-]{1,32})$/.exec(SP||'');if(m&&m[1]!==UID&&!S.ref){S.ref=m[1];S.refOk=0;gain(REFB);setTimeout(()=>toast('Бонус за приглашение: 🪙 '+f(REFB)),1500)}}
if(DB){pushScore(true).then(linkRef).then(claimInv);setInterval(()=>pushScore(),30000)}
$('snd').textContent=S.snd?'🔊':'🔇';paint();if(canDaily())setTimeout(openDaily,700);setTimeout(drop,8000);{const m=S.pp.m;if(m)$('pet').style.translate=m[0]+'px '+m[1]+'px'}
